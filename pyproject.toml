[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tropical-precipitation-discovery"
version = "0.1.0"
description = "Multi-agent research testing whether CMIP6 misses recent tropical rainfall because mean-state biases mute the circulation response to land-sea warming, not because the thermal drivers are missing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cdsapi>=0.7.7",
    "netcdf4>=1.7.3",
    "numpy>=2.2.6",
    "orchestra-agents",
    "scipy>=1.15.3",
    "xarray>=2025.6.1",
]

[tool.uv.sources]
orchestra-agents = { git = "https://github.com/aaron-zhlg/orchestra", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["agents"]
